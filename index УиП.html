Модель идеального подчинённого — это ваш личный чек-лист роста. Освоив её, вы становитесь незаменимым сотрудником, с которым хотят работать лучшие. А поднявшись на следующую ступень и став лидером, вы уже будете искать и взращивать эти качества в других, создавая команду, которая способна на великие свершения.

Помните главную мысль, с которой всё началось: «Самый лучший управленец — это тот, кто умеет быть подчинённым». Этот парадокс — ключ ко всему. Управление — это не вершина, на которую вы карабкаетесь, а мышца, которую вы качаете каждый день, независимо от должности.

Истинная сила лидера не в том, чтобы заставлять людей следовать за вами, а в том, чтобы они сами хотели идти с вами к общей цели.`
};
function setNav(k){document.getElementById("nav").innerHTML=`<div><button id="n1" aria-current="${k==="learn"}">Материал</button><button id="n2" aria-current="${k==="train"}">Тренажёр</button></div>`;document.getElementById("n1").onclick=learn;document.getElementById("n2").onclick=home}
function learn(){setNav("learn");
 app.innerHTML=`<h1>Управление и подчинение</h1><p class="mut">Сначала прочитай материал: пять частей, около 15 минут. Потом проверь себя в тренажёре. После каждой части есть кнопка быстрой проверки по этой теме.</p>`+(FULL.intro?`<h2>Вступление</h2>${FULL.intro.split("\n\n").map(t=>`<p class="full">${esc(t)}</p>`).join("")}`:"")+C.map((p,i)=>`<details class="part" ${i?"":"open"}><summary><span class="num">${i+1}</span><span class="ptitle">${esc(p[0])}</span>${p[3].some(b=>FULL[b[0]])?`<span class="tag">полный текст</span>`:""}</summary><p class="idea">${esc(FULL["i"+(i+1)]||p[1])}</p>${p[3].map(b=>`<div class="blk"><h3><span>${b[0]}</span>${esc(b[1])}</h3>${FULL[b[0]]?`<p class="gist"><b>Главное:</b> ${esc(b[2])}</p>${FULL[b[0]].split("\n\n").map(t=>`<p class="full">${esc(t)}</p>`).join("")}`:`<p>${esc(b[2])}</p>`}</div>`).join("")}${FULL["s"+(i+1)]?`<div class="blk"><h3>Итог части</h3><p class="full">${esc(FULL["s"+(i+1)])}</p></div>`:""}<button class="btn ghost chk" data-i="${i}">Проверить себя по этой части</button></details>`).join("")+(FULL.outro?`<h2>Заключение</h2>${FULL.outro.split("\n\n").map(t=>`<p class="full">${esc(t)}</p>`).join("")}`:"")+`<p style="margin-top:2rem"><button class="btn" id="tt">Перейти к тренажёру</button></p><p class="mut">Полный текст курса.</p>`;
 app.querySelectorAll(".chk").forEach(b=>b.onclick=()=>{pick=new Set(C[+b.dataset.i][2]);len=0;start()});
 document.getElementById("tt").onclick=home;window.scrollTo(0,0);
}

let len=10,S={},topics=[...new Set(Q.map(x=>x.t))],pick=new Set(topics);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function home(){setNav("train");
 let best="";try{best=localStorage.getItem("mg_best")||""}catch(e){}
 app.innerHTML=`<h1>Тренажёр «Управление и подчинение»</h1>
 <p class="mut">Рабочие ситуации по курсу «Управление и подчинение». После каждого ответа вы увидите правило, а ошибки вернутся в конце для закрепления.</p>
 <h2>Темы</h2><div class="chips">${topics.map(t=>`<button class="chip" aria-pressed="${pick.has(t)}" data-t="${esc(t)}">${esc(t)}</button>`).join("")}</div>
 <h2>Сколько вопросов</h2><div class="chips">${[10,20,0].map(n=>`<button class="chip" aria-pressed="${len===n}" data-n="${n}">${n||"Все"}</button>`).join("")}</div><button class="btn" id="go" ${pick.size?"":"disabled"}>Начать тренировку</button>${best?`<p class="mut">Лучший результат: ${esc(best)}</p>`:""}`;
 app.querySelectorAll(".chip[data-t]").forEach(b=>b.onclick=()=>{const t=b.dataset.t;pick.has(t)?pick.delete(t):pick.add(t);home()});
 app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{len=+b.dataset.n;home()});
 document.getElementById("go").onclick=start;
}
function start(){setNav("train");let qs=shuf(Q.filter(x=>pick.has(x.t)));if(len)qs=qs.slice(0,len);S={queue:qs,i:0,total:qs.length,ok:0,by:{},retry:new Set(),chosen:[]};show()}
function show(){
 const q=S.queue[S.i];S.chosen=[];S.done=false;
 const retry=S.retry.has(q)?" (повторение)":"";
 const head=`<div class="row"><span class="topic">${esc(q.t)}${retry}</span><span class="mut">${S.i+1} из ${S.queue.length}</span></div><div class="bar"><i style="width:${S.i/S.queue.length*100}%"></i></div><p class="q">${esc(q.q)}</p>`;
 if(q.type==="order"){S.items=shuf(q.items);drawOrder(head,q)}
 else if(q.type==="multi"){S.sel=new Set();drawMulti(head,q)}
 else{app.innerHTML=head+q.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")+`<div id="fb"></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k===q.a,q,b))}
}
function drawOrder(head,q){
 app.innerHTML=head+S.items.map((it,k)=>{const n=S.chosen.indexOf(k);return `<button class="opt ${n>=0?"sel":""}" data-k="${k}" ${S.done?"disabled":""}>${n>=0?`<b>${n+1}.</b> `:""}${esc(it)}</button>`}).join("")+`<div id="fb"></div><button class="btn ghost" id="rs">Сбросить</button>`;
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(S.chosen.includes(k))return;S.chosen.push(k);
  if(S.chosen.length<S.items.length)return drawOrder(head,q);
  S.done=true;const good=S.chosen.every((k,n)=>S.items[k]===q.items[n]);drawOrder(head,q);fin(good,q)});
 document.getElementById("rs").onclick=()=>{S.chosen=[];S.done=false;drawOrder(head,q)};
}
function drawMulti(head,q,done){
 app.innerHTML=head+`<p class="mut">Выбери все верные варианты.</p>`+q.o.map((o,k)=>{const on=S.sel.has(k),r=q.a.includes(k);return `<button class="opt ${done?(r?"ok":on?"bad":""):(on?"sel":"")}" data-k="${k}" ${done?"disabled":""}>${esc(o)}</button>`}).join("")+`<div id="fb"></div>`+(done?"":`<button class="btn ghost" id="ck">Проверить</button>`);
 if(done)return;
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;S.sel.has(k)?S.sel.delete(k):S.sel.add(k);drawMulti(head,q)});
 document.getElementById("ck").onclick=()=>{if(!S.sel.size)return;const good=q.o.every((_,k)=>S.sel.has(k)===q.a.includes(k));drawMulti(head,q,true);fin(good,q)};
}
function answer(good,q,btn){
 app.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add("ok")});
 if(!good)btn.classList.add("bad");fin(good,q);
}
function fin(good,q){
 const by=S.by[q.t]=S.by[q.t]||{ok:0,n:0};by.n++;
 if(!S.retry.has(q)){if(good){S.ok++;by.ok++}else{S.retry.add(q);S.queue.push(q)}}
 const last=S.i===S.queue.length-1;
 const ans=q.type==="order"?`<p><b>Верный порядок:</b> ${q.items.map((x,n)=>`${n+1}. ${esc(x)}`).join("; ")}.</p>`:"";
 document.getElementById("fb").innerHTML=`<div class="fb ${good?"ok":"bad"}"><b>${good?"Верно":"Не совсем"}</b>${ans}<p>${esc(q.e)}</p></div><button class="btn" id="nx">${last?"Смотреть итог":"Дальше"}</button>`;
 document.getElementById("rs")?.remove();
 document.getElementById("nx").onclick=()=>{last?result():(S.i++,show())};
}
function result(){
 const pct=Math.round(S.ok/S.total*100),miss=[...S.retry];
 try{const b=+(localStorage.getItem("mg_bestn")||-1);if(pct>b){localStorage.setItem("mg_bestn",pct);localStorage.setItem("mg_best",pct+"% ("+S.ok+" из "+S.total+")")}}catch(e){}
 app.innerHTML=`<h1>${pct}% с первой попытки</h1><p class="mut">${S.ok} из ${S.total} верно сразу. ${miss.length?"Ошибочные вопросы вы уже повторили в конце тренировки.":"Ошибок не было."}</p>
 <h2>По темам</h2><table>${Object.entries(S.by).map(([t,v])=>`<tr><td>${esc(t)}</td><td>${v.ok} из ${v.n}</td></tr>`).join("")}</table>
